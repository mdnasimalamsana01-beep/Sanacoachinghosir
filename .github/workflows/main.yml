name: Build Sana Coaching APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract project
        run: |
          mkdir project
          unzip -q SanaCoachingHosir.zip -d project

      - name: Build APK
        working-directory: project/SanaCoachingHosir
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sana-Coaching-Hosir-APK
          path: project/SanaCoachingHosir/app/build/outputs/apk/debug/app-debug.apk
